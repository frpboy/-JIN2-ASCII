<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Will you marry me</title>
<style>
  html, body { margin:0; padding:0; background:#000; height:100%; overflow:hidden; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:safe center; min-height:100vh; min-height:100dvh; }
  #stage { display:none; flex-direction:column; align-items:center; max-height:100dvh; }
  #stage.revealed { display:flex; }
  #wrap { position:relative; }
  canvas { display:block; max-width:96vw; max-height:62vh; max-height:62dvh; width:auto; height:auto; }
  #msgwrap { position:relative; }
  #message {
    color:#e8d9a0; font:clamp(15px, 4.6vw, 22px)/1.6 ui-monospace, Menlo, Consolas, monospace;
    text-align:center; padding:10px 16px 4px; text-shadow:0 0 12px rgba(232,217,160,.35);
    visibility:hidden; transition:opacity .4s ease;
  }
  #message.settled { visibility:visible; }
  #swarm { position:absolute; left:50%; top:0; transform:translateX(-50%); transition:opacity .35s ease; filter:drop-shadow(0 0 3px rgba(232,217,160,.55)); }
  #credit {
    color:#6e6878; font:11px/1.5 ui-monospace, Menlo, Consolas, monospace;
    text-align:center; padding:0 16px 14px;
  }
  #credit a { color:#8a8498; text-decoration:none; }
  #intro {
    position:fixed; inset:0; background:#000; z-index:10;
    display:flex; align-items:center; justify-content:center;
    transition:opacity .8s ease;
  }
  #intro.gone { opacity:0; pointer-events:none; }
  #tapme {
    background:none; border:none; cursor:pointer; text-align:center;
    color:#e8d9a0; font:18px/1.4 ui-monospace, Menlo, Consolas, monospace;
  }
  #tapme .heart {
    display:block; perspective:520px; width:128px; height:118px; margin:0 auto 10px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,77,109,.30) 0%, rgba(255,77,109,.10) 45%, transparent 72%);
  }
  #tapme .heart svg {
    width:110px; height:auto; margin-top:6px; transform-style:preserve-3d;
    filter:drop-shadow(0 0 22px rgba(255,77,109,.55));
    animation:heartturn 5.2s linear infinite, heartbob 2.8s ease-in-out infinite alternate;
  }
  @keyframes heartturn { from { transform:rotateY(0deg); } to { transform:rotateY(360deg); } }
  @keyframes heartbob { from { translate:0 0; } to { translate:0 -7px; } }
  @media (prefers-reduced-motion: reduce) { #tapme .heart svg { animation:none; } }
</style>
</head>
<body>
<div id="intro">
  <button id="tapme" type="button" aria-label="Tap me"><span class="heart"><svg viewBox="0 0 100 94" role="img" aria-label="red heart"><defs><radialGradient id="hg" cx="35%" cy="28%" r="85%"><stop offset="0%" stop-color="#ff9fb0"/><stop offset="35%" stop-color="#ff4d6d"/><stop offset="75%" stop-color="#d61f42"/><stop offset="100%" stop-color="#a3122f"/></radialGradient></defs><path d="M50 88 C48 85 10 60 10 32 C10 16 22 6 34 6 C42 6 48 11 50 17 C52 11 58 6 66 6 C78 6 90 16 90 32 C90 60 52 85 50 88 Z" fill="url(#hg)"/><ellipse cx="33" cy="22" rx="14" ry="8" fill="#ffffff" opacity="0.38" transform="rotate(-20 33 22)"/></svg></span>Tap me</button>
</div>
<div id="stage">
  <div id="wrap"><canvas id="c" width="1080" height="960"></canvas></div>
  <div id="msgwrap">
    <div id="message">I love you ponna<br>Will you marry me</div>
  </div>
  <div id="credit"><a href="https://github.com/frpboy">frpboy</a></div>
</div>
<audio id="bgm" src="love-me.m4a" loop preload="none"></audio>
<script>
const bgm = document.getElementById('bgm');
const intro = document.getElementById('intro');
const stage = document.getElementById('stage');
const message = document.getElementById('message');
const tapme = document.getElementById('tapme');

// ---- music: only ever audible while the page is visible AND focused ----
let focused = document.hasFocus();
function audible() { return focused && !document.hidden; }

let wantPlaying = false; // set only by the visitor's explicit Tap me activation
let everStarted = false; // playback has successfully begun at least once

function tryPlay() {
  if (!audible() || !bgm.paused) return;
  bgm.play().then(function () { everStarted = true; })
            .catch(function () { /* the next tap, focus return or bounded recovery retries */ });
}

// Bounded recovery: at most MAX_RECOVERIES back-to-back load+retry attempts with
// backoff, reset by successful playback or any visitor tap. Never fetches or
// plays while the page is hidden or unfocused.
let recoveries = 0, recoverTimer = 0;
const MAX_RECOVERIES = 3;
function cancelRecover() { if (recoverTimer) { clearTimeout(recoverTimer); recoverTimer = 0; } }
function scheduleRecover() {
  if (!wantPlaying || !audible()) return;
  if (recoveries >= MAX_RECOVERIES || recoverTimer) return;
  recoveries++;
  recoverTimer = setTimeout(function () {
    recoverTimer = 0;
    // Skip if playback recovered on its own or the page went inactive meanwhile.
    if (wantPlaying && audible() && bgm.paused) { bgm.load(); tryPlay(); }
  }, 1000 * recoveries);
}
bgm.addEventListener('playing', function () { recoveries = 0; cancelRecover(); });
bgm.addEventListener('stalled', scheduleRecover);
bgm.addEventListener('error', scheduleRecover);
// Loop fallback in case the loop attribute is not honored.
bgm.addEventListener('ended', function () {
  cancelRecover();
  bgm.currentTime = 0;
  if (wantPlaying && audible()) tryPlay();
});

function pauseForFocus() { cancelRecover(); if (!bgm.paused) bgm.pause(); }
function resumeForFocus() { if (wantPlaying && audible()) tryPlay(); }
document.addEventListener('visibilitychange', function () {
  if (document.hidden) pauseForFocus(); else resumeForFocus();
});
window.addEventListener('blur', function () { focused = false; pauseForFocus(); });
window.addEventListener('focus', function () { focused = true; resumeForFocus(); });
window.addEventListener('pageshow', function () { focused = document.hasFocus(); resumeForFocus(); });

// After activation, any later tap quietly doubles as a recovery retry (no visible controls).
['pointerdown', 'touchstart', 'click'].forEach(function (evt) {
  document.addEventListener(evt, function () {
    recoveries = 0;
    if (wantPlaying && audible() && bgm.paused) tryPlay();
  }, { passive: true });
});

// ---- reveal sequence: dark screen + Tap me heart, then ring + swarming words ----
let revealed = false;
tapme.addEventListener('click', function () {
  if (revealed) return;
  revealed = true;
  wantPlaying = true;
  bgm.load();
  tryPlay(); // inside the visitor's real tap: this is what starts the music
  intro.classList.add('gone');
  stage.classList.add('revealed');
  setTimeout(function () { intro.remove(); }, 900);
  const s = document.createElement('script');
  s.src = 'ring.js';
  document.body.appendChild(s);
  swarmMessage();
});

function swarmMessage() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
    message.classList.add('settled');
    return;
  }
  const LINES = ['I love you ponna', 'Will you marry me'];
  const COLOR = '#e8d9a0';
  const fontSize = parseFloat(getComputedStyle(message).fontSize) || 22;
  const lineHeight = Math.round(fontSize * 1.6);
  const padX = 16, padY = 14;
  const FAMILY = 'ui-monospace, Menlo, Consolas, monospace';

  // Render the exact message offscreen and sample its pixels as swarm targets.
  const off = document.createElement('canvas');
  const octx = off.getContext('2d', { willReadFrequently: true });
  octx.font = fontSize + 'px ' + FAMILY;
  const textW = Math.ceil(Math.max(octx.measureText(LINES[0]).width, octx.measureText(LINES[1]).width));
  const W = textW + padX * 2, H = lineHeight * 2 + padY * 2;
  const SAMPLE = 2; // sample at 2x for smoother edges
  off.width = W * SAMPLE; off.height = H * SAMPLE;
  octx.scale(SAMPLE, SAMPLE);
  octx.font = fontSize + 'px ' + FAMILY;
  octx.fillStyle = '#fff';
  octx.textAlign = 'center';
  octx.textBaseline = 'middle';
  octx.fillText(LINES[0], W / 2, padY + lineHeight * 0.5);
  octx.fillText(LINES[1], W / 2, padY + lineHeight * 1.5);
  const img = octx.getImageData(0, 0, off.width, off.height).data;
  const STRIDE = 4; // device px of the 2x canvas -> one target per 2 CSS px
  let targets = [];
  for (let y = 0; y < off.height; y += STRIDE)
    for (let x = 0; x < off.width; x += STRIDE)
      if (img[(y * off.width + x) * 4 + 3] > 128)
        targets.push([x / SAMPLE, y / SAMPLE]);
  if (targets.length > 1800) {
    const keep = [];
    const step = targets.length / 1800;
    for (let i = 0; i < 1800; i++) keep.push(targets[Math.floor(i * step)]);
    targets = keep;
  }

  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cvs = document.createElement('canvas');
  cvs.id = 'swarm';
  cvs.width = Math.round(W * dpr);
  cvs.height = Math.round(H * dpr);
  cvs.style.width = W + 'px';
  cvs.style.height = H + 'px';
  document.getElementById('msgwrap').appendChild(cvs);
  const sctx = cvs.getContext('2d');
  sctx.scale(dpr, dpr);
  sctx.fillStyle = COLOR;

  const parts = targets.map(function (t) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.max(W, H) * (0.7 + Math.random() * 0.9);
    return {
      x: W / 2 + Math.cos(a) * r,
      y: H / 2 + Math.sin(a) * r,
      tx: t[0], ty: t[1],
      delay: Math.random() * 900,
      dur: 1400 + Math.random() * 800
    };
  });
  const MAX_T = 900 + 2200 + 800; // latest possible arrival + hold
  const start = performance.now();
  function frameSwarm(now) {
    const el = now - start;
    sctx.clearRect(0, 0, W, H);
    let done = true;
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      let k = (el - p.delay) / p.dur;
      if (k < 1) done = false;
      k = Math.min(1, Math.max(0, k));
      const e = 1 - Math.pow(1 - k, 3); // easeOutCubic
      sctx.fillRect(p.x + (p.tx - p.x) * e, p.y + (p.ty - p.y) * e, 2, 2);
    }
    if (done && el > MAX_T) {
      message.classList.add('settled');
      cvs.style.opacity = '0';
      setTimeout(function () { cvs.remove(); }, 400);
      return;
    }
    requestAnimationFrame(frameSwarm);
  }
  requestAnimationFrame(frameSwarm);
}
</script>
</body>
</html>
