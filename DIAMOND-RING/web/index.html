<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Will you marry me</title>
<style>
  html, body { margin:0; padding:0; background:#000; height:100%; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; }
  #wrap { position:relative; }
  canvas { display:block; max-width:96vw; max-height:78vh; width:auto; height:auto; }
  #message {
    color:#e8d9a0; font:22px/1.6 ui-monospace, Menlo, Consolas, monospace;
    text-align:center; padding:14px 16px 6px; text-shadow:0 0 12px rgba(232,217,160,.35);
  }
  #credit {
    color:#6e6878; font:11px/1.5 ui-monospace, Menlo, Consolas, monospace;
    text-align:center; padding:0 16px 14px;
  }
  #credit a { color:#8a8498; text-decoration:none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1080" height="960"></canvas></div>
<div id="message">
  I love you ponna<br>
  Will you marry me
</div>
<div id="credit"><a href="https://github.com/frpboy">frpboy</a></div>
<audio id="bgm" src="love-me.m4a" loop preload="auto"></audio>
<script>
const bgm = document.getElementById('bgm');
bgm.play().catch(() => {}); // browsers may block autoplay; the first tap anywhere starts it
document.addEventListener('pointerdown', () => { if (bgm.paused) bgm.play().catch(() => {}); }, { once: true });
bgm.addEventListener('ended', () => { bgm.currentTime = 0; bgm.play().catch(() => {}); });
// Music only while the page is focused: pause on blur/hidden, resume on return.
let musicWasPlaying = false;
function pauseForFocus() { if (!bgm.paused) { musicWasPlaying = true; bgm.pause(); } }
function resumeForFocus() { if (musicWasPlaying && bgm.paused) { musicWasPlaying = false; bgm.play().catch(() => {}); } }
document.addEventListener('visibilitychange', () => { document.hidden ? pauseForFocus() : resumeForFocus(); });
window.addEventListener('blur', pauseForFocus);
window.addEventListener('focus', resumeForFocus);
</script>
<script src="ring.js"></script>
</body>
</html>
