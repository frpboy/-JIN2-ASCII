<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Will you marry me</title>
<style>
  html, body { margin:0; padding:0; background:#000; height:100%; overflow:hidden; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:safe center; min-height:100vh; min-height:100dvh; }
  #stage { display:none; flex-direction:column; align-items:center; max-height:100dvh; }
  #stage.revealed { display:flex; }
  #wrap { position:relative; }
  canvas { display:block; max-width:96vw; max-height:62vh; max-height:62dvh; width:auto; height:auto; }
  #msgwrap { position:relative; }
  #message {
    font:clamp(15px, 4.6vw, 22px)/1.6 ui-monospace, Menlo, Consolas, monospace;
    text-align:center; padding:10px 16px 4px;
    visibility:hidden;
  }
  #message.settled { visibility:visible; }
  #message .l1, #message .l2 { opacity:0; color:#e8d9a0; }
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    #message .l1, #message .l2 {
      background:linear-gradient(105deg, #e8d9a0 42%, #fffbe8 50%, #e8d9a0 58%);
      background-size:300% 100%;
      background-position:100% 0;
      -webkit-background-clip:text; background-clip:text;
      color:transparent;
    }
  }
  #message.settled .l1 { animation:mfade 1.1s ease .5s 1 forwards, mshine 2.4s ease-in-out .5s 1 forwards; }
  #message.settled .l2 { animation:mfade 1.3s ease 2.2s 1 forwards, mshine 2.9s ease-in-out 2.2s 1 forwards; }
  @keyframes mfade { from { opacity:0; } to { opacity:1; } }
  @keyframes mshine { from { background-position:100% 0; } to { background-position:0% 0; } }
  @media (prefers-reduced-motion: reduce) {
    #message .l1, #message .l2 { animation:none !important; opacity:1; background:none; color:#e8d9a0; }
  }
  #credit {
    color:#6e6878; font:11px/1.5 ui-monospace, Menlo, Consolas, monospace;
    text-align:center; padding:0 16px 14px;
  }
  #credit a { color:#8a8498; text-decoration:none; }
  #intro {
    position:fixed; inset:0; background:#000; z-index:10;
    display:flex; align-items:center; justify-content:center;
    transition:opacity .8s ease;
  }
  #intro.gone { opacity:0; pointer-events:none; }
  #tapme {
    background:none; border:none; cursor:pointer; text-align:center;
    color:#e8d9a0; font:18px/1.4 ui-monospace, Menlo, Consolas, monospace;
  }
  #tapme .heart { display:block; margin:0 auto 6px; }
  #h3dc { width:150px; height:140px; display:block; }
  #h2d { width:110px; height:auto; margin:6px auto 0; display:block;
    filter:drop-shadow(0 0 22px rgba(255,77,109,.55)); }
</style>
</head>
<body>
<div id="intro">
  <button id="tapme" type="button" aria-label="Tap me"><span class="heart"><canvas id="h3dc" width="300" height="280" role="img" aria-label="rotating red 3D heart"></canvas><svg id="h2d" viewBox="0 0 100 94" aria-hidden="true"><defs><radialGradient id="hg" cx="35%" cy="28%" r="85%"><stop offset="0%" stop-color="#ff9fb0"/><stop offset="35%" stop-color="#ff4d6d"/><stop offset="75%" stop-color="#d61f42"/><stop offset="100%" stop-color="#a3122f"/></radialGradient></defs><path d="M50 88 C48 85 10 60 10 32 C10 16 22 6 34 6 C42 6 48 11 50 17 C52 11 58 6 66 6 C78 6 90 16 90 32 C90 60 52 85 50 88 Z" fill="url(#hg)"/><ellipse cx="33" cy="22" rx="14" ry="8" fill="#ffffff" opacity="0.38" transform="rotate(-20 33 22)"/></svg></span>Tap me</button>
</div>
<div id="stage">
  <div id="wrap"><canvas id="c" width="1080" height="960"></canvas></div>
  <div id="msgwrap">
    <div id="message"><span class="l1">I love you ponna</span><br><span class="l2">Will you marry me</span></div>
  </div>
  <div id="credit"><a href="https://github.com/frpboy">Kannan</a></div>
</div>
<audio id="bgm" src="love-me.m4a" loop preload="none"></audio>
<script>
const bgm = document.getElementById('bgm');
const intro = document.getElementById('intro');
const stage = document.getElementById('stage');
const message = document.getElementById('message');
const tapme = document.getElementById('tapme');

// ---- music: only ever audible while the page is visible AND focused ----
let focused = document.hasFocus();
function audible() { return focused && !document.hidden; }

let wantPlaying = false; // set only by the visitor's explicit Tap me activation
let everStarted = false; // playback has successfully begun at least once

function tryPlay() {
  if (!audible() || !bgm.paused) return;
  bgm.play().then(function () { everStarted = true; })
            .catch(function () { /* the next tap, focus return or bounded recovery retries */ });
}

// Bounded recovery: at most MAX_RECOVERIES back-to-back load+retry attempts with
// backoff, reset by successful playback or any visitor tap. Never fetches or
// plays while the page is hidden or unfocused.
let recoveries = 0, recoverTimer = 0;
const MAX_RECOVERIES = 3;
function cancelRecover() { if (recoverTimer) { clearTimeout(recoverTimer); recoverTimer = 0; } }
function scheduleRecover() {
  if (!wantPlaying || !audible()) return;
  if (recoveries >= MAX_RECOVERIES || recoverTimer) return;
  recoveries++;
  recoverTimer = setTimeout(function () {
    recoverTimer = 0;
    // Skip if playback recovered on its own or the page went inactive meanwhile.
    if (wantPlaying && audible() && bgm.paused) { bgm.load(); tryPlay(); }
  }, 1000 * recoveries);
}
bgm.addEventListener('playing', function () { recoveries = 0; cancelRecover(); });
bgm.addEventListener('stalled', scheduleRecover);
bgm.addEventListener('error', scheduleRecover);
// Loop fallback in case the loop attribute is not honored.
bgm.addEventListener('ended', function () {
  cancelRecover();
  bgm.currentTime = 0;
  if (wantPlaying && audible()) tryPlay();
});

function pauseForFocus() { cancelRecover(); if (!bgm.paused) bgm.pause(); }
function resumeForFocus() { if (wantPlaying && audible()) tryPlay(); }
document.addEventListener('visibilitychange', function () {
  if (document.hidden) pauseForFocus(); else resumeForFocus();
});
window.addEventListener('blur', function () { focused = false; pauseForFocus(); });
window.addEventListener('focus', function () { focused = true; resumeForFocus(); });
window.addEventListener('pageshow', function () { focused = document.hasFocus(); resumeForFocus(); });

// After activation, any later tap quietly doubles as a recovery retry (no visible controls).
['pointerdown', 'touchstart', 'click'].forEach(function (evt) {
  document.addEventListener(evt, function () {
    recoveries = 0;
    if (wantPlaying && audible() && bgm.paused) tryPlay();
  }, { passive: true });
});

// ---- intro heart: a real 3D glossy heart (WebGL mesh), falling back to the SVG if unavailable ----
(function () {
  const cvs = document.getElementById('h3dc');
  const fb = document.getElementById('h2d');
  const fbHTML = fb ? fb.outerHTML : '';
  function bail() { if (cvs.parentNode) cvs.remove(); } // the glossy SVG stays as the fallback
  const gl = cvs.getContext('webgl', { alpha: true, antialias: true, premultipliedAlpha: false });
  if (!gl) { bail(); return; }

  // Puffy pillow extrusion of the true 2D heart outline: boundary rings shrink
  // toward the center while bulging in z, so the silhouette keeps the two
  // lobes and the central notch at every angle of the turn.
  function H(t) {
    const st = Math.sin(t);
    return [16 * st * st * st,
            13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)];
  }
  const NO = 220, K = 16, D = 6.5;
  const ox = [], oy = [];
  let minY = 1e9, maxY = -1e9, maxX = 0, cx = 0, cy = 0;
  for (let i = 0; i < NO; i++) {
    const pt = H((i / NO) * Math.PI * 2);
    ox.push(pt[0]); oy.push(pt[1]);
    if (pt[1] < minY) minY = pt[1];
    if (pt[1] > maxY) maxY = pt[1];
    if (Math.abs(pt[0]) > maxX) maxX = Math.abs(pt[0]);
    cx += pt[0]; cy += pt[1];
  }
  cx /= NO; cy /= NO;
  const s0 = 2.3 / Math.max(maxY - minY, 2 * maxX);
  for (let i = 0; i < NO; i++) { ox[i] = (ox[i] - cx) * s0; oy[i] = (oy[i] - cy) * s0; }
  const dd = D * s0;

  // Ring 0 (z = 0) is shared by both caps; front rings bulge +z, back rings -z.
  const verts = [];
  for (let i = 0; i < NO; i++) verts.push(ox[i], oy[i], 0);
  const F1 = verts.length / 3;
  for (let k = 1; k < K; k++) {
    const s = 1 - k / K, z = dd * Math.sqrt(Math.max(0, 1 - s * s));
    for (let i = 0; i < NO; i++) verts.push(s * ox[i], s * oy[i], z);
  }
  const FA = verts.length / 3; verts.push(0, 0, dd);
  const B1 = verts.length / 3;
  for (let k = 1; k < K; k++) {
    const s = 1 - k / K, z = -dd * Math.sqrt(Math.max(0, 1 - s * s));
    for (let i = 0; i < NO; i++) verts.push(s * ox[i], s * oy[i], z);
  }
  const BA = verts.length / 3; verts.push(0, 0, -dd);

  function ringBase(front, k) { return k === 0 ? 0 : (front ? F1 : B1) + (k - 1) * NO; }
  const idx = [];
  function cap(front) {
    const start = idx.length;
    for (let k = 0; k < K - 1; k++) {
      const A = ringBase(front, k), B = ringBase(front, k + 1);
      for (let i = 0; i < NO; i++) {
        const i2 = (i + 1) % NO;
        idx.push(A + i, A + i2, B + i, A + i2, B + i2, B + i);
      }
    }
    const apex = front ? FA : BA, L = ringBase(front, K - 1);
    for (let i = 0; i < NO; i++) {
      const i2 = (i + 1) % NO;
      idx.push(L + i, L + i2, apex);
    }
    return [start, idx.length];
  }
  const fr = cap(true), br = cap(false);

  // Smooth numeric normals, then force each cap's winding to face outward.
  const nv = verts.length / 3;
  const norms = new Array(nv * 3);
  function accumulate() {
    norms.fill(0);
    for (let j = 0; j < idx.length; j += 3) {
      const a = idx[j] * 3, b = idx[j + 1] * 3, c = idx[j + 2] * 3;
      const ux = verts[b] - verts[a], uy = verts[b + 1] - verts[a + 1], uz = verts[b + 2] - verts[a + 2];
      const wx = verts[c] - verts[a], wy = verts[c + 1] - verts[a + 1], wz = verts[c + 2] - verts[a + 2];
      const nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx;
      for (const o of [a, b, c]) { norms[o] += nx; norms[o + 1] += ny; norms[o + 2] += nz; }
    }
  }
  function flip(range) {
    for (let j = range[0]; j < range[1]; j += 3) { const t2 = idx[j + 1]; idx[j + 1] = idx[j + 2]; idx[j + 2] = t2; }
  }
  accumulate();
  let flipped = false;
  if (norms[FA * 3 + 2] < 0) { flip(fr); flipped = true; }
  if (norms[BA * 3 + 2] > 0) { flip(br); flipped = true; }
  if (flipped) accumulate();
  for (let i = 0; i < nv; i++) {
    const l = Math.sqrt(norms[i * 3] ** 2 + norms[i * 3 + 1] ** 2 + norms[i * 3 + 2] ** 2) || 1;
    norms[i * 3] /= l; norms[i * 3 + 1] /= l; norms[i * 3 + 2] /= l;
  }

  function sh(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null;
  }
  const vs = sh(gl.VERTEX_SHADER,
    'attribute vec3 pos; attribute vec3 nrm;' +
    'uniform mat4 mv; uniform mat4 pr; uniform mat3 nm;' +
    'varying vec3 vN; varying vec3 vP;' +
    'void main(){ vN = normalize(nm * nrm); vec4 p = mv * vec4(pos, 1.0); vP = p.xyz;' +
    'gl_Position = pr * p; }');
  const fs = sh(gl.FRAGMENT_SHADER,
    'precision mediump float; varying vec3 vN; varying vec3 vP;' +
    'void main(){' +
    'vec3 N = normalize(vN);' +
    'vec3 L = normalize(vec3(0.45, 0.75, 0.65));' +
    'vec3 V = normalize(-vP);' +
    'vec3 H = normalize(L + V);' +
    'float diff = max(dot(N, L), 0.0);' +
    'float spec = pow(max(dot(N, H), 0.0), 48.0);' +
    'float spec2 = pow(max(dot(normalize(normalize(vec3(-0.6, -0.2, 0.5)) + V), N), 0.0), 24.0);' +
    'float rim = pow(1.0 - max(dot(N, V), 0.0), 2.2);' +
    'vec3 base = vec3(0.82, 0.11, 0.25);' +
    'vec3 col = base * (0.30 + 0.70 * diff)' +
    ' + vec3(1.0, 0.92, 0.92) * spec * 0.95' +
    ' + vec3(1.0, 0.55, 0.6) * spec2 * 0.35' +
    ' + vec3(0.9, 0.15, 0.3) * rim * 0.55;' +
    'gl_FragColor = vec4(col, 1.0); }');
  if (!vs || !fs) { bail(); return; }
  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { bail(); return; }
  gl.useProgram(prog);
  const aPos = gl.getAttribLocation(prog, 'pos'), aNrm = gl.getAttribLocation(prog, 'nrm');
  const uMV = gl.getUniformLocation(prog, 'mv'), uPR = gl.getUniformLocation(prog, 'pr'), uNM = gl.getUniformLocation(prog, 'nm');
  const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
  const nb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, nb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(norms), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(aNrm); gl.vertexAttribPointer(aNrm, 3, gl.FLOAT, false, 0, 0);
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
  gl.enable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
  gl.clearColor(0, 0, 0, 0);

  function perspective(fov, asp, n, f) {
    const t = 1 / Math.tan(fov / 2), d = 1 / (n - f);
    return [t / asp, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) * d, -1, 0, 0, 2 * f * n * d, 0];
  }
  const pr = perspective(0.55, cvs.width / cvs.height, 0.1, 20);
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function draw(t) {
    const ay = t * 0.0006;                  // slow full turn (~10.5s)
    const ax = -0.16 + Math.sin(t * 0.0009) * 0.05;
    const bob = Math.sin(t * 0.0022) * 0.07;
    const cyw = Math.cos(ay), syw = Math.sin(ay), cxw = Math.cos(ax), sxw = Math.sin(ax);
    // mv = translate(0, bob, -4.1) * rotX(ax) * rotY(ay)
    const mv = [
      cyw, sxw * syw, -cxw * syw, 0,
      0, cxw, sxw, 0,
      syw, -sxw * cyw, cxw * cyw, 0,
      0, bob, -4.1, 1
    ];
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.uniformMatrix4fv(uMV, false, mv);
    gl.uniformMatrix4fv(uPR, false, pr);
    gl.uniformMatrix3fv(uNM, false, [mv[0], mv[1], mv[2], mv[4], mv[5], mv[6], mv[8], mv[9], mv[10]]);
    gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_SHORT, 0);
  }

  let raf = 0, lost = false, firstDrawn = false;
  function afterDraw() { // the SVG fallback stays until a frame is really on screen
    if (!firstDrawn) { firstDrawn = true; if (fb) fb.remove(); }
  }
  cvs.addEventListener('webglcontextlost', function (e) {
    e.preventDefault(); lost = true;
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    const holder = cvs.parentNode;
    if (cvs.parentNode) cvs.remove();
    if (holder && document.getElementById('intro') && fbHTML && !document.getElementById('h2d')) {
      holder.insertAdjacentHTML('beforeend', fbHTML); // restore the fallback heart
    }
  });
  function frame(t) {
    if (lost || !cvs.isConnected) return; // stop when the intro is removed after the tap
    draw(t);
    afterDraw();
    raf = requestAnimationFrame(frame);
  }
  if (reduced) { draw(0); afterDraw(); return; }
  raf = requestAnimationFrame(frame);
})();

// ---- reveal sequence: dark screen + Tap me heart, then ring + swarming words ----
let revealed = false;
tapme.addEventListener('click', function () {
  if (revealed) return;
  revealed = true;
  wantPlaying = true;
  bgm.load();
  tryPlay(); // inside the visitor's real tap: this is what starts the music
  intro.classList.add('gone');
  stage.classList.add('revealed');
  setTimeout(function () { intro.remove(); }, 900);
  const s = document.createElement('script');
  s.src = 'ring.js';
  document.body.appendChild(s);
  swarmMessage();
});

function swarmMessage() {
  // Soft gold light sweep: line one fades in as a warm glow passes over the
  // letters, line two follows more slowly, then both stay still and readable.
  message.classList.add('settled');
}
</script>
</body>
</html>
