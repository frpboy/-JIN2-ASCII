<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Will you marry me</title>
<style>
  html, body { margin:0; padding:0; background:#000; height:100%; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; }
  #wrap { position:relative; }
  canvas { display:block; max-width:96vw; max-height:78vh; width:auto; height:auto; }
  #message {
    color:#e8d9a0; font:22px/1.6 ui-monospace, Menlo, Consolas, monospace;
    text-align:center; padding:14px 16px 6px; text-shadow:0 0 12px rgba(232,217,160,.35);
  }
  #credit {
    color:#6e6878; font:11px/1.5 ui-monospace, Menlo, Consolas, monospace;
    text-align:center; padding:0 16px 14px;
  }
  #credit a { color:#8a8498; text-decoration:none; }
  #music {
    background:none; border:0; cursor:pointer; margin-top:4px;
    color:#b8b0c8; font:12px/1.5 ui-monospace, Menlo, Consolas, monospace;
  }
  #music:hover { color:#e8d9a0; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1080" height="960"></canvas></div>
<div id="message">
  I love you ponna<br>
  Will you marry me
</div>
<div id="credit"><a href="https://github.com/frpboy">frpboy</a></div>
<button id="music" type="button">&#9834; play music</button>
<audio id="bgm" src="love-me.m4a" loop preload="auto"></audio>
<script>
const bgm = document.getElementById('bgm');
const musicBtn = document.getElementById('music');
function syncMusic() { musicBtn.textContent = bgm.paused ? '\u266A play music' : '\u266A mute music'; }
bgm.play().catch(() => {}); // browsers may block autoplay; the button and first tap cover that
musicBtn.addEventListener('click', () => { bgm.paused ? bgm.play() : bgm.pause(); });
document.addEventListener('pointerdown', (e) => { if (e.target !== musicBtn && bgm.paused) bgm.play().catch(() => {}); }, { once: true });
bgm.addEventListener('play', syncMusic);
bgm.addEventListener('pause', syncMusic);
// Backstop for browsers that drop the loop attribute, and auto-resume after
// the OS/browser suspends audio (screen lock, audio focus) when the page returns.
let musicWasPlaying = false;
bgm.addEventListener('ended', () => { bgm.currentTime = 0; bgm.play().catch(() => {}); });
bgm.addEventListener('stalled', () => { if (!bgm.paused) bgm.play().catch(() => {}); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { musicWasPlaying = !bgm.paused; }
  else if (musicWasPlaying && bgm.paused) { bgm.play().catch(() => {}); }
});
syncMusic();
</script>
<script src="ring.js"></script>
</body>
</html>
